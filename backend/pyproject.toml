[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leadership-ai"
version = "0.1.0"
description = "Agentic leadership potential assessment engine"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "langgraph>=0.2",
  "numpy>=1.26",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.30",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
